[package]
name = "sui-scope-rust"
version = "1.0.0"
edition = "2024"
publish = false

[dependencies]
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"

move-binary-format = { path = "vendor/move-rust/crates/move-binary-format" }
move-bytecode-verifier = { path = "vendor/move-rust/crates/move-bytecode-verifier" }
move-decompiler = { path = "vendor/move-rust/crates/move-decompiler" }

[target.'cfg(target_os = "linux")'.dependencies]
http-body-util = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
vercel_runtime = "2"

[[bin]]
name = "decompile"
path = "api/decompile.rs"

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
strip = true
